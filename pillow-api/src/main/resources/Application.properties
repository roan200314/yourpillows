spring.application.name=yourpillows
spring.profiles.active=local
spring.datasource.url=jdbc:mysql://localhost:3306/yourpillow-db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate configuratie
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Algemene configuratie
server.port=8080

# CORS-configuratie (voor het beheren van cross-origin requests)
spring.web.cors.allowed-origins=http://localhost:8080
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true


# Actuator Monitoring (optioneel)
management.endpoints.web.exposure.include=health, metrics

spring.datasource.username=root
spring.datasource.password=Roan1972!
spring.datasource.hikari.pool-name=HikariCP