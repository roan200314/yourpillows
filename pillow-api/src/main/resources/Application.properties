spring.application.name=yourpillows
spring.profiles.active=render

# JPA & Hibernate configuratie
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Algemene configuratie
server.port=8080

# CORS-configuratie (voor het beheren van cross-origin requests)
spring.web.cors.allowed-origins=http://localhost:4173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true


# Bestanden uploaden
upload.directory=/uploads
spring.resources.static-locations=classpath:/static/,file:/uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator Monitoring (optioneel)
management.endpoints.web.exposure.include=health, metrics
