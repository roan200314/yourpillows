spring.application.name=yourpillows
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=jdbc:mysql://yourpillows-db:3306/yourpillows
spring.datasource.username=root
spring.datasource.password=Roan1972!
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
frontend.url=http://localhost:3004
spring.web.cors.allowed-origins=http://localhost:8080
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Ensure database tables are updated automatically (for dev)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Disable Flyway if not using migration scripts
spring.flyway.enabled=false

# Enable Actuator Monitoring (Optional)
management.endpoints.web.exposure.include=health, metrics

upload.directory=C:/yourpillows/uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


