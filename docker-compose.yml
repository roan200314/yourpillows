version: '3.8'

services:
  backend:
    build: ./pillow-api
    container_name: yourpillows-backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://yourpillows-db:3306/yourpillows
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - yourpillows-network

  frontend:
    build: ./src
    container_name: yourpillows-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - yourpillows-network

  db:  # <<< Dit moet binnen 'services:' staan!
    image: mysql:8.0
    container_name: yourpillows-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: yourpillows
    ports:
      - "3307:3306"
    networks:
      - yourpillows-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
      start_period: 20s

networks:
  yourpillows-network:
    driver: bridge
